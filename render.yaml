services:
  - type: web
    name: movie-night
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: friends
      - key: DB_PATH
        value: /var/data/movie-night.sqlite
      - key: AUTO_CATALOG_REFRESH_HOURS
        value: '24'
      - key: TMDB_API_READ_TOKEN
        sync: false
    disk:
      name: movie-night-data
      mountPath: /var/data
      sizeGB: 1
